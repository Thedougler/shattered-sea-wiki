[project]
name = "player-view"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0",
    "parakeet-mlx>=0.2",
    "mlx>=0.18",
    "pyannote.audio>=3.1",
    "torch>=2.2",
    "torchaudio>=2.2",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "omegaconf>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
player-view = "player_view.main:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
