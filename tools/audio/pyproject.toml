[project]
name = "shattered-audio"
version = "0.1.0"
description = "Session audio transcription, diarization, and wiki formatting for the Shattered Sea campaign"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper>=0.4.0",
    "pydub>=0.25.1",
    "pyyaml>=6.0",
    "typer>=0.15.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
diarize = [
    "pyannote.audio>=3.3",
    "torch>=2.0",
]
live = [
    "sounddevice>=0.5.0",
    "resemblyzer>=0.1.3",
    "numpy>=1.24",
    "torch>=2.0",
    "torchaudio>=2.0",
]
# Laughter highlight detection (experiment). Needs ffmpeg + wget on PATH; first run
# downloads the PANNs checkpoint (~330 MB) to ~/panns_data/.
laughs = [
    "panns-inference>=0.1.1",
    "torch>=2.0",
]
all = [
    "shattered-audio[diarize,live,laughs]",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[project.scripts]
shattered-audio = "shattered_audio.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
