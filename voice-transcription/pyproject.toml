[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-transcription"
version = "0.1.0"
description = "Voice profiling and session transcription for the Shattered Sea campaign"
requires-python = ">=3.11"
dependencies = [
    "parakeet-mlx>=0.2",
    "mlx>=0.18",
    "pyannote.audio>=3.1",
    "diart>=0.9.2",
    "torch>=2.2",
    "torchaudio>=2.2",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "nicegui>=2.0",
    "textual>=0.50",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
save-voice = "voice_transcription.cli.save_voice:main"
transcribe-session = "voice_transcription.cli.transcribe:main"
finalize-session = "voice_transcription.cli.finalize:main"
voice-session = "voice_transcription.cli.operator:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
